<!DOCTYPE html>
<html>
<head>
	<title>One Day in New York</title>
	<link rel="stylesheet" type="text/css" href="css/style.css">
</head>

<body>

	<h1 id="title">One Day in New York</h1>
	<p>Click the title to say hello.</p>

	<div id="card">
		<img src="images/image1.jpg" id="photo" width="480">
		<p id="caption">Started the day with sunrise at Brooklyn.</p>
	</div>

	<p>Pick a part of the day to change the photo.</p>
	<button id="sunriseBtn">Sunrise</button>
	<button id="breakfastBtn">Breakfast</button>
	<button id="ferryBtn">Ferry</button>
	<button id="nightBtn">Night</button>

	<p>Change the frame.</p>
	<button id="darkBtn">Dark</button>
	<button id="lightBtn">Light</button>

	<p>More.</p>
	<button id="postcardBtn">Open postcard</button>
	<button id="likeBtn">Did you like the trip?</button>

	<p>Liked the trip: <span id="result"></span></p>

</body>
</html>
